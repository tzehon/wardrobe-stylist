# fly.toml app configuration file generated for wardrobe-backend-faithful-silence-9494 on 2026-07-09T15:50:31+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wardrobe-backend-faithful-silence-9494'
primary_region = 'sin'

[build]
[env]
  ENVIRONMENT = 'production'
  AUTH_MODE = 'app_attest'
  APP_ATTEST_ENVIRONMENT = 'production'
  APP_ATTEST_DATABASE_PATH = '/data/app-attest/auth.sqlite3'
  APP_ATTEST_APP_ID_PREFIX = '29NT767Y9P'
  APP_ATTEST_BUNDLE_ID = 'com.tth.Wardrobe'
  APP_ATTEST_ALLOWED_VALIDATION_CATEGORIES = '2'
  APP_ATTEST_ALLOWED_BUNDLE_VERSIONS = '4'

[mounts]
  source = 'wardrobe_auth_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
