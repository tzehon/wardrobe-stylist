name: Wardrobe
options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: com.tth
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Debug.xcconfig
  Release: Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    # Simulator builds use ad-hoc signing — gives the app a real identity (Keychain APIs
    # need one) without requiring an Apple Developer Team. Device builds keep automatic
    # signing with DEVELOPMENT_TEAM from Distribution.xcconfig.
    "CODE_SIGN_STYLE[sdk=iphonesimulator*]": "Manual"
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    CODE_SIGN_STYLE: Automatic
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "9.2.0"
targets:
  Wardrobe:
    type: application
    platform: iOS
    sources:
      - path: Wardrobe
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tth.Wardrobe
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Wardrobe/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        # App icon lives in Wardrobe/Resources/Assets.xcassets. actool injects
        # CFBundleIconName + the icon files into the built Info.plist (required by
        # App Store / TestFlight upload validation).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    postBuildScripts:
      - name: Validate public Release configuration
        script: |
          "${SRCROOT}/scripts/validate-public-release-settings.sh" \
            "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        basedOnDependencyAnalysis: false
  WardrobeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WardrobeTests
    dependencies:
      - target: Wardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tth.WardrobeTests
        GENERATE_INFOPLIST_FILE: YES
  WardrobeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WardrobeUITests
    dependencies:
      - target: Wardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tth.WardrobeUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Wardrobe
schemes:
  Wardrobe:
    build:
      targets:
        Wardrobe: all
    test:
      targets:
        - WardrobeTests
        - WardrobeUITests
