name: backend

on:
  push:
    paths:
      - "backend/**"
      - "ios/project.yml"
      - "shared/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "ios/project.yml"
      - "shared/**"
      - ".github/workflows/backend.yml"
  schedule:
    # Re-check the locked environment when a new advisory appears even if the
    # repository itself has not changed.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --locked

      - name: Audit dependencies
        run: uv run --locked pip-audit

      - name: Static security scan
        run: uv run --locked bandit -r app container_entrypoint.py -q

      - name: Test (pytest)
        run: uv run --locked pytest

      - name: Lint (ruff)
        run: uv run --locked ruff check .

      - name: Type-check (mypy)
        run: uv run --locked mypy app

      - name: Verify production container runs unprivileged
        run: |
          set -euo pipefail
          docker build --tag wardrobe-backend-ci .
          docker run --rm wardrobe-backend-ci sh -c \
            'test "$(id -u)" = 10001 && \
             grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status && \
             ! command -v uv >/dev/null 2>&1 && \
             ! command -v perl >/dev/null 2>&1 && \
             python -c "import sqlite3; sqlite3.connect(\":memory:\").execute(\"SELECT 1\")"'

          logging_output="$(
            docker run --rm wardrobe-backend-ci \
              /app/.venv/bin/python -c '
          import logging
          import os

          from uvicorn import Config

          if os.getuid() != 10001:
              raise SystemExit("unexpected service uid")
          Config(
              "app.main:app",
              access_log=False,
              log_config="/app/uvicorn-logging.json",
          ).configure_logging()

          from app.auth.service import _security_event

          _security_event(event="registration_succeeded", mechanism="app_attest")
          logging.getLogger("app.routes.recommend").warning(
              "stylist_failure code=invalid_model_response"
          )
          logging.getLogger("app.routes.recommend").info(
              "general_app_info_must_stay_disabled"
          )
          logging.getLogger("uvicorn.access").info("access_log_must_stay_disabled")
          ' 2>&1
          )"
          test "$(printf '%s\n' "$logging_output" | grep -Fc \
            'auth_security_event event=registration_succeeded code=- scope=- path=- mechanism=app_attest')" = 1
          test "$(printf '%s\n' "$logging_output" | grep -Fc \
            'stylist_failure code=invalid_model_response')" = 1
          ! printf '%s\n' "$logging_output" | grep -Fq 'general_app_info_must_stay_disabled'
          ! printf '%s\n' "$logging_output" | grep -Fq 'access_log_must_stay_disabled'

          volume_name="wardrobe-auth-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume_name" >/dev/null
          trap 'docker volume rm "$volume_name" >/dev/null' EXIT

          docker run --rm \
            --env ENVIRONMENT=production \
            --env APP_ATTEST_DATABASE_PATH=/data/app-attest/auth.sqlite3 \
            --volume "$volume_name:/data" \
            wardrobe-backend-ci \
            sh -c 'test "$(id -u)" = 10001 && : > /data/app-attest/auth.sqlite3'

          test "$(docker run --rm \
            --env ENVIRONMENT=production \
            --env APP_ATTEST_DATABASE_PATH=/data/app-attest/auth.sqlite3 \
            --volume "$volume_name:/data" \
            wardrobe-backend-ci id -u)" = "10001"
