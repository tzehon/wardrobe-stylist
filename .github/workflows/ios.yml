name: ios

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify build toolchain
        run: |
          set -euo pipefail
          XCODE_MAJOR=$(xcodebuild -version | awk '/Xcode/{split($2, v, "."); print v[1]}')
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | awk -F. '{print $1}')
          test "$XCODE_MAJOR" -ge 26
          test "$SDK_MAJOR" -ge 26
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve pinned packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Wardrobe.xcodeproj \
            -scheme Wardrobe \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for rt in d for x in d[rt] if x.get('isAvailable') and 'iPhone' in x['name']]; print(ids[0] if ids else '')")
          echo "Picked simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Wardrobe.xcodeproj \
            -scheme Wardrobe \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -onlyUsePackageVersionsFromResolvedFile
          # NOTE: do NOT pass CODE_SIGNING_ALLOWED=NO — the app must be ad-hoc
          # signed on the simulator (CODE_SIGN_IDENTITY=- in project.yml) so the
          # Keychain has an application-identifier entitlement. Without signing,
          # TokenStorage's Keychain calls fail with -34018 (errSecMissingEntitlement).

      - name: Build Release artifact
        working-directory: ios
        run: |
          xcodebuild build \
            -project Wardrobe.xcodeproj \
            -scheme Wardrobe \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData/ReleaseValidation \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Verify Release artifact and SDK privacy manifests
        working-directory: ios
        run: scripts/verify-release-artifact.sh DerivedData/ReleaseValidation
